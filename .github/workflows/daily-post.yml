name: Daily Google post

on:
  schedule:
    - cron: "0 6 * * *"    # 08:00 South Africa time - device post
    - cron: "0 11 * * *"   # 13:00 South Africa time - location post
  workflow_dispatch:
    inputs:
      slot:
        description: "Which kind of post"
        type: choice
        options: [device, location]
        default: device
      send:
        description: "Send to Google (untick to only make the post and image)"
        type: boolean
        default: true
      page:
        description: "Optional: post this page instead of the next one (e.g. iphone-11-pro-repair)"
        type: string
        default: ""
      button:
        description: "Button for this post"
        type: choice
        options: [automatic, LEARN_MORE, CALL, BOOK]
        default: automatic

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet pillow anthropic

      - name: Write the post and draw the image
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGE: ${{ inputs.page }}
          BUTTON: ${{ inputs.button }}
          SLOT: ${{ github.event.schedule == '0 11 * * *' && 'location' || inputs.slot || 'device' }}
        run: python scripts/daily_post.py build

      - name: Save image and progress
        run: |
          git config user.name "iAssist post robot"
          git config user.email "actions@users.noreply.github.com"
          git add posts state.json post.json index.html
          git commit -m "Post for $(TZ=Africa/Johannesburg date +%F)"
          git pull --rebase
          git push

      - name: Send to Google Business Profile (via Make.com)
        if: github.event_name == 'schedule' || inputs.send
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python scripts/daily_post.py send
